<header>
    <nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top">
      <div class="container">
        <a class="navbar-brand" href="{{ site.baseurl }}/"><span class="font-weight-bold">Haoming</span> Wang</a>
        <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse"
          data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="icon-bar top-bar"></span>
          <span class="icon-bar middle-bar"></span>
          <span class="icon-bar bottom-bar"></span>
        </button>
        <div class="collapse navbar-collapse text-right" id="navbarNav">
          <ul class="navbar-nav ml-auto flex-nowrap">
            <li class="nav-item{% if page.url == '/' %} active{% endif %}">
              <a class="nav-link" href="{{ site.baseurl }}/">home</a>
            </li>
            <li class="nav-item{% if page.url == '/' %} active-anchor{% endif %}">
              <a class="nav-link" href="{{ site.baseurl }}/#publications">publications</a>
            </li>
            <li class="nav-item{% if page.url contains '/notes' %} active{% endif %}">
              <a class="nav-link" href="{{ site.baseurl }}/notes/">notes</a>
            </li>
            <li class="nav-item{% if page.url contains '/about-me' %} active{% endif %}">
              <a class="nav-link" href="{{ site.baseurl }}/about-me/">more about me</a>
            </li>
            <li class="nav-item">
              {% assign latest_cv = '' %}
              {% for f in site.static_files %}
                {% if f.path contains '/pdfs/CV_' and f.extname == '.pdf' %}
                  {% if f.path > latest_cv %}{% assign latest_cv = f.path %}{% endif %}
                {% endif %}
              {% endfor %}
              <a class="nav-link" href="{{ site.baseurl }}{{ latest_cv }}" target="_blank">cv</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
